name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: usbip-server-apk
          path: app/build/outputs/apk/debug/*.apk
      - run: cp app/build/outputs/apk/debug/app-debug.apk USBIP-Server.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: USB/IP Server APK
          files: USBIP-Server.apk
